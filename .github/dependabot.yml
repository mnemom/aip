version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/packages/typescript"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/packages/python"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]
  # Hash-pinned CI/publish tooling (.github/requirements/*.txt, compiled from *.in).
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    groups:
      ci-tooling:
        patterns: ["*"]
  # The verifier, its page and the results report each carry their own package-lock.json.
  - package-ecosystem: "npm"
    directories:
      - "/packages/verifier"
      - "/packages/verifier-page"
      - "/packages/results-report"
    schedule:
      interval: "weekly"
    groups:
      package-dependencies:
        patterns: ["*"]
