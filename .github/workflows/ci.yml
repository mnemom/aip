name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


permissions: {}
jobs:
  typescript:
    permissions:
      contents: read
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  verifier:
    permissions:
      contents: read
    name: Verifier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/verifier

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/verifier/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  python:
    permissions:
      contents: read
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Install dependencies (frozen, from uv.lock)
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --locked --extra dev ruff check src/ tests/

      - name: Typecheck
        # mypy's target is fixed by [tool.mypy] python_version = "3.10" in
        # pyproject.toml, so it produces identical results on every matrix
        # interpreter — running it on all three legs was redundant. Gated to the
        # highest matrix version (3.12) so it runs exactly once.
        if: matrix.python-version == '3.12'
        run: uv run --locked --extra dev mypy src/

      - name: Test
        run: uv run --locked --extra dev pytest

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          file: packages/python/coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  dispatch-deploy:
    permissions:
      contents: read
    name: Trigger Deploy
    needs: [typescript, verifier, python]
    if: >-
      always() &&
      github.event_name == 'push' &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: mnemom

      - name: Commit subject
        id: commit
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: printf 'title=%s\n' "${HEAD_COMMIT_MESSAGE%%$'\n'*}" >> "$GITHUB_OUTPUT"

      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: mnemom/deploy
          event-type: deploy
          client-payload: >-
            {
              "repo": "${{ github.event.repository.name }}",
              "sha": "${{ github.sha }}",
              "commit_title": ${{ toJSON(steps.commit.outputs.title) }},
              "environment": "${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}"
            }
