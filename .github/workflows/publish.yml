name: Publish

# npm side: thin caller for the canonical mnemom/.github/npm-publish.yml
# reusable (ADR-020). PyPI Trusted Publishing does NOT support reusable
# workflows (https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github),
# so the PyPI publish step is INLINE here. Don't try to lift it into a
# reusable — the OIDC token's `job_workflow_ref` claim points to the
# reusable, and PyPI rejects with `invalid-publisher`. Verified painfully
# May 8, 2026 (the canonical mnemom/.github/.github/workflows/pypi-publish.yml
# is retained for token-based publishes and as a non-OIDC SBOM utility).
#
# Repo-specific logic stays inline either way:
#   - validate: tag vs. packages/typescript/package.json + packages/python/pyproject.toml versions
#   - test: TypeScript build/typecheck/test + Python mypy/pytest
#
# The dispatch-publish path fires both publishes in parallel on every main
# push; each path's skip-on-existing handles unchanged versions.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dispatch-id:
        description: "Correlation ID from deploy orchestrator"
        required: false
        type: string
      npm-directory:
        description: "Directory containing package.json to publish"
        required: false
        type: string
        default: "packages/typescript"


permissions: {}
jobs:
  # ── Release-triggered: validate → test → (publish-npm, publish-pypi) ──

  validate:
    permissions:
      contents: read
    if: github.event_name == 'release'
    name: Validate versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Check Python version
        working-directory: packages/python
        run: |
          PYPI_VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          if [ "$PYPI_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "ERROR: pyproject.toml version ($PYPI_VERSION) != tag (${{ steps.tag.outputs.version }})"
            exit 1
          fi
      - name: Check npm version
        run: |
          NPM_VERSION=$(node -p "require('./packages/typescript/package.json').version")
          if [ "$NPM_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "ERROR: package.json version ($NPM_VERSION) != tag (${{ steps.tag.outputs.version }})"
            exit 1
          fi

  test:
    permissions:
      contents: read
    if: github.event_name == 'release'
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: TypeScript checks
        working-directory: packages/typescript
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
      # Frozen, hash-verified install from packages/python/uv.lock — the same
      # resolution ci.yml's python job gates on (OpenSSF Scorecard Pinned-Dependencies).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Python checks
        working-directory: packages/python
        run: |
          uv sync --locked --extra dev
          uv run --locked --extra dev mypy src/
          uv run --locked --extra dev pytest

  publish-pypi:
    name: Publish to PyPI
    needs: [validate, test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC → PyPI Trusted Publisher
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        working-directory: packages/python
        run: |
          # Hash-pinned build frontend (OpenSSF Scorecard Pinned-Dependencies).
          python -m pip install --require-hashes -r "$GITHUB_WORKSPACE/.github/requirements/build.txt"
          python -m build
      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/python/dist/

  publish-npm:
    needs: [validate, test]
    if: github.event_name == 'release'
    permissions:
      contents: write   # for SBOM attach to GitHub Release
      id-token: write   # for npm OIDC Trusted Publisher
    # mnemom/.github @ scale/step-29-bump-node24-actions merge (ADR-020)
    uses: mnemom/.github/.github/workflows/npm-publish.yml@3b60e34e88113070235f2d55248a3455295be153
    with:
      npm-directory: packages/typescript
      tag: latest

  # ── Release-triggered: @mnemom/aip-verifier → dist-tag `next` ONLY (MNE-9044) ──
  #
  # The verifier is pre-GA. It publishes with `--tag next` and never `latest`;
  # promoting to `latest` is a separate, human `npm dist-tag add`. Three layers:
  #   1. verifier-guard refuses any tag but `next` (script + its test) and is the
  #      ONLY source of the tag handed to the reusable publish below.
  #   2. verifier-test re-runs the verifier CI gates (ci.yml `verifier` job) and
  #      a `npm publish --dry-run --tag next` before anything is published.
  #   3. verify-verifier-dist-tag fails the run if `latest` points at the
  #      version just published.
  # Not wired into workflow_dispatch: dispatch-publish-npm stays typescript-only.

  verifier-guard:
    permissions:
      contents: read
    if: github.event_name == 'release'
    name: Verifier dist-tag guard
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.guard.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Guard script self-test
        run: .github/scripts/check-npm-dist-tag.test.sh
      - name: Refuse any dist-tag but next
        id: guard
        env:
          VERIFIER_NPM_TAG: next
        run: |
          .github/scripts/check-npm-dist-tag.sh "$VERIFIER_NPM_TAG"
          echo "tag=$VERIFIER_NPM_TAG" >> "$GITHUB_OUTPUT"

  verifier-test:
    permissions:
      contents: read
    if: github.event_name == 'release'
    name: Verifier CI gates + publish dry-run
    needs: [verifier-guard]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/verifier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Publish dry-run (tag next)
        env:
          NPM_TAG: ${{ needs.verifier-guard.outputs.tag }}
        run: npm publish --dry-run --access public --tag "$NPM_TAG"

  publish-npm-verifier:
    name: Publish @mnemom/aip-verifier (next)
    needs: [verifier-guard, verifier-test]
    if: github.event_name == 'release'
    permissions:
      contents: write   # for SBOM attach to GitHub Release
      id-token: write   # for npm OIDC Trusted Publisher + provenance
    # Same reusable + pin as publish-npm above (ADR-020). aip is a PUBLIC repo,
    # so provenance (default true in the reusable) is accepted by npm.
    uses: mnemom/.github/.github/workflows/npm-publish.yml@3b60e34e88113070235f2d55248a3455295be153
    with:
      npm-directory: packages/verifier
      tag: ${{ needs.verifier-guard.outputs.tag }}
      provenance: true

  verify-verifier-dist-tag:
    permissions:
      contents: read
    name: Verify verifier is not on latest
    needs: [publish-npm-verifier]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Fail if latest points at the published verifier version
        run: |
          PKG_NAME=$(node -p "require('./packages/verifier/package.json').name")
          PKG_VERSION=$(node -p "require('./packages/verifier/package.json').version")
          LATEST=$(npm view "$PKG_NAME" dist-tags.latest 2>/dev/null || echo "")
          echo "$PKG_NAME dist-tags.latest='${LATEST}' (this release: $PKG_VERSION)"
          if [ "$LATEST" = "$PKG_VERSION" ]; then
            echo "ERROR: $PKG_NAME@$PKG_VERSION is tagged latest; verifier must be next-only" >&2
            exit 1
          fi

  # ── Orchestrator dispatch publishing ──
  #
  # Both jobs fire in parallel on every main push. Each one's skip-on-existing
  # logic makes a no-op publish idempotent — when version is unchanged from
  # the registry, the call short-circuits without touching the registry.

  dispatch-publish-npm:
    if: github.event_name == 'workflow_dispatch'
    # contents: write is over-granted relative to what dispatch-publish does
    # (the `gh release upload` step in the reusable workflow is gated on
    # `event_name == 'release'` and never runs here). But GitHub validates
    # caller permissions against the called workflow's declared permissions
    # at workflow load time, before any `if:` is evaluated.
    permissions:
      contents: write
      id-token: write
    # mnemom/.github @ scale/step-29-bump-node24-actions merge (ADR-020)
    uses: mnemom/.github/.github/workflows/npm-publish.yml@3b60e34e88113070235f2d55248a3455295be153
    with:
      # Defensive defaults: GitHub validates `with:` expressions at load time,
      # before `if:` is evaluated. On a release event the `inputs` context is
      # empty; the `||` fallback keeps the expression valid on both event types.
      npm-directory: ${{ inputs.npm-directory || 'packages/typescript' }}
      dispatch-id: ${{ inputs.dispatch-id || '' }}
      tag: latest
      attach-sbom-to-release: false   # dispatch path has no release to attach to

  dispatch-publish-pypi:
    name: Publish packages/python (dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC → PyPI Trusted Publisher
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Read package metadata
        id: meta
        working-directory: packages/python
        run: |
          PKG_NAME=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['name'])
          ")
          PKG_VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          echo "pkg-name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "pkg-version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
      - name: Check if already published
        id: check
        run: |
          PKG_NAME="${{ steps.meta.outputs.pkg-name }}"
          PKG_VERSION="${{ steps.meta.outputs.pkg-version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/${PKG_NAME}/${PKG_VERSION}/json")
          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${PKG_VERSION} already published — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Will publish ${PKG_NAME}@${PKG_VERSION}"
          fi
      - name: Build sdist + wheel
        if: steps.check.outputs.skip != 'true'
        working-directory: packages/python
        run: |
          # Hash-pinned build frontend (OpenSSF Scorecard Pinned-Dependencies).
          python -m pip install --require-hashes -r "$GITHUB_WORKSPACE/.github/requirements/build.txt"
          python -m build
      - name: Publish to PyPI (Trusted Publisher)
        if: steps.check.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/python/dist/
          skip-existing: true
