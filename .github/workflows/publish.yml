name: Publish

# npm side: thin caller for the canonical mnemom/.github/npm-publish.yml
# reusable (ADR-020). PyPI Trusted Publishing does NOT support reusable
# workflows (https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github),
# so the PyPI publish step is INLINE here. Don't try to lift it into a
# reusable — the OIDC token's `job_workflow_ref` claim points to the
# reusable, and PyPI rejects with `invalid-publisher`. Verified painfully
# May 8, 2026 (the canonical mnemom/.github/.github/workflows/pypi-publish.yml
# is retained for token-based publishes and as a non-OIDC SBOM utility).
#
# Repo-specific logic stays inline either way:
#   - validate: tag vs. packages/typescript/package.json + packages/python/pyproject.toml versions
#   - test: TypeScript build/typecheck/test + Python mypy/pytest
#
# The dispatch-publish path fires both publishes in parallel on every main
# push; each path's skip-on-existing handles unchanged versions.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dispatch-id:
        description: "Correlation ID from deploy orchestrator"
        required: false
        type: string
      npm-directory:
        # A choice, not a free string: a dispatch can never hand packages/verifier
        # (GitHub release asset only, MNE-9044) to the npm reusable below.
        description: "Directory containing package.json to publish"
        required: false
        type: choice
        options:
          - packages/typescript
        default: "packages/typescript"


permissions: {}
jobs:
  # ── Release-triggered: validate → test → (publish-npm, publish-pypi) ──
  #
  # SDK releases only. A tag starting with `aip-verifier-` is a verifier-only
  # release (K4.1): these four jobs skip, so the SDK tag/version check never
  # fails and npm/PyPI are never touched, and only the verifier jobs below run.
  # The verifier jobs carry the inverse condition, so the two paths are disjoint.

  validate:
    permissions:
      contents: read
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'aip-verifier-')
    name: Validate versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Check Python version
        working-directory: packages/python
        run: |
          PYPI_VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          if [ "$PYPI_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "ERROR: pyproject.toml version ($PYPI_VERSION) != tag (${{ steps.tag.outputs.version }})"
            exit 1
          fi
      - name: Check npm version
        run: |
          NPM_VERSION=$(node -p "require('./packages/typescript/package.json').version")
          if [ "$NPM_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "ERROR: package.json version ($NPM_VERSION) != tag (${{ steps.tag.outputs.version }})"
            exit 1
          fi

  test:
    permissions:
      contents: read
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'aip-verifier-')
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: TypeScript checks
        working-directory: packages/typescript
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
      # Frozen, hash-verified install from packages/python/uv.lock — the same
      # resolution ci.yml's python job gates on (OpenSSF Scorecard Pinned-Dependencies).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Python checks
        working-directory: packages/python
        run: |
          uv sync --locked --extra dev
          uv run --locked --extra dev mypy src/
          uv run --locked --extra dev pytest

  publish-pypi:
    name: Publish to PyPI
    needs: [validate, test]
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'aip-verifier-')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC → PyPI Trusted Publisher
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        working-directory: packages/python
        run: |
          # Hash-pinned build frontend (OpenSSF Scorecard Pinned-Dependencies).
          python -m pip install --require-hashes -r "$GITHUB_WORKSPACE/.github/requirements/build.txt"
          python -m build
      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/python/dist/

  publish-npm:
    needs: [validate, test]
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'aip-verifier-')
    permissions:
      contents: write   # for SBOM attach to GitHub Release
      id-token: write   # for npm OIDC Trusted Publisher
    # mnemom/.github @ scale/step-29-bump-node24-actions merge (ADR-020)
    uses: mnemom/.github/.github/workflows/npm-publish.yml@3b60e34e88113070235f2d55248a3455295be153
    with:
      npm-directory: packages/typescript
      tag: latest

  # ── Release-triggered: @mnemom/aip-verifier → GitHub release asset (MNE-9044) ──
  #
  # Owner decision (2026-10-27): the verifier is NOT published to npm. A release
  # carries the packed tarball as a release asset. No npm token or OIDC is used.
  #   1. verifier-guard keeps the existing guard script + self-test.
  #   2. verifier-test re-runs the verifier CI gates (ci.yml `verifier` job) and
  #      packs the tarball, handed to the upload job as an artifact.
  #   3. upload-verifier-release attaches the tarball to the release with `gh`.
  # Verifier-only releases (tag `aip-verifier-v<version>`) only: an SDK `v*`
  # release skips these three jobs and carries no verifier tarball.
  # Not wired into workflow_dispatch: dispatch-publish-npm stays typescript-only
  # (the `npm-directory` input is a choice with that one option).

  verifier-guard:
    permissions:
      contents: read
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'aip-verifier-')
    name: Verifier dist-tag guard
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.guard.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Guard script self-test
        run: .github/scripts/check-npm-dist-tag.test.sh
      - name: Refuse any dist-tag but next
        id: guard
        env:
          VERIFIER_NPM_TAG: next
        run: |
          .github/scripts/check-npm-dist-tag.sh "$VERIFIER_NPM_TAG"
          echo "tag=$VERIFIER_NPM_TAG" >> "$GITHUB_OUTPUT"

  verifier-test:
    permissions:
      contents: read
      id-token: write       # Sigstore signing for the build-provenance attestation
      attestations: write   # store the attestation on mnemom/aip
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'aip-verifier-')
    name: Verifier CI gates + pack tarball
    needs: [verifier-guard]
    runs-on: ubuntu-latest
    outputs:
      tarball-sha256: ${{ steps.pack.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/verifier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
      - name: Check tag against verifier version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERIFIER_VERSION=$(node -p "require('./package.json').version")
          if [ "${RELEASE_TAG#aip-verifier-v}" != "$VERIFIER_VERSION" ]; then
            echo "ERROR: packages/verifier/package.json version ($VERIFIER_VERSION) != tag ($RELEASE_TAG)"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Pack verifier tarball
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/verifier-pack"
          npm pack --pack-destination "$RUNNER_TEMP/verifier-pack"
          ls -l "$RUNNER_TEMP/verifier-pack"
          set -- "$RUNNER_TEMP"/verifier-pack/*.tgz
          if [ "$#" -ne 1 ]; then echo "ERROR: expected one tarball, found $#"; exit 1; fi
          echo "sha256=$(sha256sum "$1" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # Build provenance for the exact bytes upload-verifier-release attaches:
      # the subject is this .tgz, and the upload job refuses a tarball whose
      # sha256 differs from steps.pack.outputs.sha256.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/verifier-pack/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier-tarball
          path: ${{ runner.temp }}/verifier-pack/*.tgz
          if-no-files-found: error

  upload-verifier-release:
    name: Attach verifier tarball to GitHub release
    needs: [verifier-guard, verifier-test]
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'aip-verifier-')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release upload
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verifier-tarball
          path: verifier-pack
      - name: Check the tarball is the attested one
        env:
          ATTESTED_SHA256: ${{ needs.verifier-test.outputs.tarball-sha256 }}
        run: |
          set -- verifier-pack/*.tgz
          if [ "$#" -ne 1 ]; then echo "ERROR: expected one tarball, found $#"; exit 1; fi
          GOT=$(sha256sum "$1" | cut -d' ' -f1)
          if [ -z "$ATTESTED_SHA256" ] || [ "$GOT" != "$ATTESTED_SHA256" ]; then
            echo "ERROR: tarball sha256 $GOT != attested ${ATTESTED_SHA256:-<missing>}"
            exit 1
          fi
      - name: Upload tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" verifier-pack/*.tgz

  # ── Orchestrator dispatch publishing ──
  #
  # Both jobs fire in parallel on every main push. Each one's skip-on-existing
  # logic makes a no-op publish idempotent — when version is unchanged from
  # the registry, the call short-circuits without touching the registry.

  # The dispatch path publishes to npm `latest`, which is only ever the SDK.
  # Refuse any other directory: npm-directory=packages/verifier would put the
  # verifier on npm `latest`, which the owner ruled out (MNE-9044); the
  # verifier ships only as a GitHub release asset (aip-verifier- tags above).
  dispatch-guard:
    name: Refuse npm-directory other than packages/typescript
    if: github.event_name == 'workflow_dispatch'
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Check npm-directory
        env:
          NPM_DIRECTORY: ${{ inputs.npm-directory || 'packages/typescript' }}
        run: |
          if [ "$NPM_DIRECTORY" != "packages/typescript" ]; then
            echo "ERROR: npm-directory '$NPM_DIRECTORY' is not allowed; the dispatch path publishes packages/typescript only"
            exit 1
          fi

  dispatch-publish-npm:
    needs: [dispatch-guard]
    if: github.event_name == 'workflow_dispatch'
    # contents: write is over-granted relative to what dispatch-publish does
    # (the `gh release upload` step in the reusable workflow is gated on
    # `event_name == 'release'` and never runs here). But GitHub validates
    # caller permissions against the called workflow's declared permissions
    # at workflow load time, before any `if:` is evaluated.
    permissions:
      contents: write
      id-token: write
    # mnemom/.github @ scale/step-29-bump-node24-actions merge (ADR-020)
    uses: mnemom/.github/.github/workflows/npm-publish.yml@3b60e34e88113070235f2d55248a3455295be153
    with:
      # Defensive defaults: GitHub validates `with:` expressions at load time,
      # before `if:` is evaluated. On a release event the `inputs` context is
      # empty; the `||` fallback keeps the expression valid on both event types.
      npm-directory: ${{ inputs.npm-directory || 'packages/typescript' }}
      dispatch-id: ${{ inputs.dispatch-id || '' }}
      tag: latest
      attach-sbom-to-release: false   # dispatch path has no release to attach to

  dispatch-publish-pypi:
    name: Publish packages/python (dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC → PyPI Trusted Publisher
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Read package metadata
        id: meta
        working-directory: packages/python
        run: |
          PKG_NAME=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['name'])
          ")
          PKG_VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          echo "pkg-name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "pkg-version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
      - name: Check if already published
        id: check
        run: |
          PKG_NAME="${{ steps.meta.outputs.pkg-name }}"
          PKG_VERSION="${{ steps.meta.outputs.pkg-version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/${PKG_NAME}/${PKG_VERSION}/json")
          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${PKG_VERSION} already published — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Will publish ${PKG_NAME}@${PKG_VERSION}"
          fi
      - name: Build sdist + wheel
        if: steps.check.outputs.skip != 'true'
        working-directory: packages/python
        run: |
          # Hash-pinned build frontend (OpenSSF Scorecard Pinned-Dependencies).
          python -m pip install --require-hashes -r "$GITHUB_WORKSPACE/.github/requirements/build.txt"
          python -m build
      - name: Publish to PyPI (Trusted Publisher)
        if: steps.check.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/python/dist/
          skip-existing: true
