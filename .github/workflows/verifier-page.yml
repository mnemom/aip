name: Verifier page

# Build the static verifier page (packages/verifier-page) on top of
# @mnemom/aip-verifier and prove it verifies a record bundle offline: the
# Playwright test opens dist/index.html from file:// in an offline browser
# context, aborts and counts every non-file request, and asserts zero.
#
# Record criteria that turn green here: K4.2 (verifier page verifies a
# bundle with the network blocked) and C5 row 6 / C5-R8 (the share page,
# built with VERIFIER_PAGE_MODE=true, verifies a card from the URL fragment
# with the network blocked, draws only the lines the verifier returns, and
# has a generic preview). Runs on every PR and push to main with
# no path filter, so it can be made a required check. Uploads dist/ as the
# `verifier-page` artifact; it never deploys.

on:
  push:
    branches: [main]
  # No branch filter on pull_request: lane PRs are stacked on other lane
  # branches before they retarget to main, and K4.2 needs a run URL there.
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  page:
    permissions:
      contents: read
    name: Verifier page (offline)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            packages/verifier/package-lock.json
            packages/verifier-page/package-lock.json

      # The page depends on the verifier by file: path, so build it first.
      - name: Build @mnemom/aip-verifier
        working-directory: packages/verifier
        run: |
          npm ci
          npm run build

      - name: Install page dependencies
        working-directory: packages/verifier-page
        run: npm ci

      # The browser build is pinned by the @playwright/test version in the
      # page lockfile, so key the cache on it. On a hit, `playwright install`
      # finds the browser and skips the cdn.playwright.dev download; it still
      # installs the OS packages (--with-deps), which the cache does not hold.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/verifier-page/package-lock.json') }}

      - name: Install Chromium
        working-directory: packages/verifier-page
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: packages/verifier-page
        run: npm run typecheck

      - name: Build page
        working-directory: packages/verifier-page
        run: npm run build

      # Share page: VERIFIER_PAGE_MODE is on only when exactly "true". The
      # test build swaps in the fixture key set so the fixture card verifies;
      # it is built to dist-share/, which is never uploaded.
      - name: Build share page (VERIFIER_PAGE_MODE=true, fixture keys)
        working-directory: packages/verifier-page
        run: npm run build:share

      - name: Bundles make no network call
        working-directory: packages/verifier-page
        run: |
          for d in dist dist-share; do
            if grep -nE "fetch\(|XMLHttpRequest|sendBeacon|WebSocket\(|import\(" "$d/app.js"; then
              echo "::error::$d/app.js contains a network or dynamic-import call"; exit 1
            fi
            grep -q "connect-src 'none'" "$d/index.html"
          done
          # The deployable build carries only the published keys, never the fixture key.
          if grep -q "aap-test-record" dist/app.js; then
            echo "::error::dist/app.js contains the test key set"; exit 1
          fi
          # The deployable build is the paste verifier; the share page is opt-in.
          if grep -q "card-lines" dist/index.html; then
            echo "::error::dist/index.html is the share page; VERIFIER_PAGE_MODE must be unset in the deployable build"; exit 1
          fi

      - name: Offline verification tests (K4.2, C5-R8)
        working-directory: packages/verifier-page
        env:
          CI: "1"
        run: npm test

      - name: Upload page
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verifier-page
          path: packages/verifier-page/dist
          if-no-files-found: error

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verifier-page-traces
          path: packages/verifier-page/test-results
          if-no-files-found: ignore
