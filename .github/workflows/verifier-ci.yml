name: Verifier CI

# Typecheck, test and build @mnemom/aip-verifier (packages/verifier).
# ci.yml covers packages/typescript and packages/python only, so until this
# workflow exists the verifier's tests never run in CI.
#
# Record criteria that turn green here: K1.3 (npm test in packages/verifier),
# K4.3 (claim-lint and share-card tests), K4.4 (render-estimate.test.ts),
# K4.5 (parity test against @mnemom/sdk). Runs on every PR and push to main
# with no path filter, so it can be made a required check. Never triggers a
# deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  verifier:
    permissions:
      contents: read
    name: Verifier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/verifier

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/verifier/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
