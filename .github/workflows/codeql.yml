name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub merge-queue trigger (MNE-1213). `CodeQL` is a required check on main
  # and only reports on a ref this workflow analyzed, so it must also run in the
  # merge_group context or a queued PR waits on it forever (see ci.yml).
  merge_group:
  schedule:
    - cron: "0 0 * * 0"  # Weekly on Sundays
  workflow_dispatch:


permissions: {}
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"
