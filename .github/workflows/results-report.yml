name: Results report

# Rebuild each committed D90 results report from its signed outcomes and diff
# it byte for byte against the committed file; any difference fails (MNE-9041).
# Cases live in packages/results-report/fixtures/<case>/ as report.md plus
# either outcomes.json + jwks.json (signed AAP-Outcome/v1 statements; the
# builder verifies every signature) or rows.json (the record app's unsigned
# outcome rows, the shape mnemom-api #4129 produces; no signature to verify,
# no arm, no estimate). claim-lint runs over every report. Read-only: it never
# deploys, publishes or writes back. Runs on PRs touching the package or this
# workflow (the byte-for-byte rebuild is the C5-R9 test), on push to main, weekly
# and on demand.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packages/results-report/**"
      - ".github/workflows/results-report.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

jobs:
  rebuild:
    permissions:
      contents: read
    name: Rebuild report byte for byte
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            packages/verifier/package-lock.json
            packages/results-report/package-lock.json

      # The builder depends on the verifier by file: path, so build it first.
      - name: Build @mnemom/aip-verifier
        working-directory: packages/verifier
        run: |
          npm ci
          npm run build

      - name: Install builder dependencies
        working-directory: packages/results-report
        run: npm ci

      - name: Typecheck and test
        working-directory: packages/results-report
        run: |
          npm run typecheck
          npm test

      - name: Build report CLI
        working-directory: packages/results-report
        run: npm run build

      - name: Rebuild every report and diff byte for byte
        working-directory: packages/results-report
        run: |
          set -eu
          out="$(mktemp -d)"
          n=0
          for dir in fixtures/*/; do
            case="$(basename "$dir")"
            if [ -f "$dir/rows.json" ]; then
              node dist/cli.js build --record-rows "$dir/rows.json" --out "$out/$case.md"
            else
              node dist/cli.js build \
                --outcomes "$dir/outcomes.json" \
                --jwks "$dir/jwks.json" \
                --out "$out/$case.md"
            fi
            cmp "$out/$case.md" "$dir/report.md" || {
              echo "::error::report for '$case' differs from a rebuild of its signed outcomes"
              diff -u "$dir/report.md" "$out/$case.md" || true
              exit 1
            }
            echo "rebuilt $case: byte-identical"
            n=$((n + 1))
          done
          test "$n" -gt 0
