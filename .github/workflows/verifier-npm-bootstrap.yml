name: Verifier npm bootstrap (one-shot)

# One-shot placeholder publish that creates @mnemom/verify on npm (B1, Keith
# pick 2026-11-04). npm only lets a Trusted Publisher be added to a package
# that already exists. So this run publishes a throwaway prerelease,
# 0.6.2-bootstrap.0, under the dist-tag `bootstrap` with the org NPM_TOKEN.
# It never touches `latest`. Keith then adds the Trusted Publisher (org mnemom,
# repo aip, workflow publish.yml, environment production), and the real 0.6.2
# goes out from a verify-v0.6.2 release through publish.yml (OIDC, provenance,
# `latest`). The placeholder is deprecated after that.
#
# The placeholder version is set only inside this job (npm version
# --no-git-tag-version). packages/verifier/package.json stays 0.6.2 on main.
#
# REMOVE THIS WORKFLOW the same day the Trusted Publisher for
# @mnemom/verify is added on npmjs.com.
#
# Dispatch-only. It refuses to run if the package already exists on the
# registry, so it can never publish twice.

on:
  workflow_dispatch:

permissions: {}

jobs:
  bootstrap:
    name: Placeholder publish of @mnemom/verify (bootstrap tag)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/verifier
    env:
      PACKAGE: "@mnemom/verify"
      # The version on main. The placeholder is derived from it.
      BASE_VERSION: "0.6.2"
      VERSION: "0.6.2-bootstrap.0"
      DIST_TAG: "bootstrap"
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: npm whoami (fail loudly without a working token)
        run: |
          if ! who=$(npm whoami 2>&1); then
            echo "::error::npm whoami failed. NPM_TOKEN is missing, expired or not an npm user token: $who"
            exit 1
          fi
          echo "Publishing as npm user: $who"

      - name: Refuse unless the package is absent from the registry
        run: |
          if out=$(npm view "$PACKAGE" name 2>&1); then
            echo "::error::$PACKAGE already exists on the registry ($out). This bootstrap only runs once. Use publish.yml."
            exit 1
          fi
          if ! grep -q 'E404' <<<"$out"; then
            echo "::error::npm view did not return a 404, refusing: $out"
            exit 1
          fi
          echo "$PACKAGE is not on the registry (404), continuing"

      - name: Check the package on main, then set the placeholder version
        run: |
          v=$(node -p "require('./package.json').version")
          n=$(node -p "require('./package.json').name")
          if [ "$n" != "$PACKAGE" ] || [ "$v" != "$BASE_VERSION" ]; then
            echo "::error::packages/verifier is $n@$v, expected $PACKAGE@$BASE_VERSION"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version
          got=$(node -p "require('./package.json').version")
          if [ "$got" != "$VERSION" ]; then
            echo "::error::placeholder version is $got, expected $VERSION"
            exit 1
          fi

      - name: Refuse any dist-tag but bootstrap
        run: |
          if [ "$DIST_TAG" != "bootstrap" ]; then
            echo "::error::dist-tag is $DIST_TAG. This workflow publishes only under bootstrap, never latest."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Publish the placeholder under the bootstrap tag
        run: npm publish --access public --tag "$DIST_TAG"

      - name: Confirm the placeholder resolves and latest is not set
        run: |
          for _ in 1 2 3 4 5 6; do
            if got=$(npm view "$PACKAGE@$VERSION" version 2>/dev/null) && [ "$got" = "$VERSION" ]; then
              echo "$PACKAGE@$VERSION resolves"
              tags=$(npm view "$PACKAGE" dist-tags --json)
              echo "$tags"
              # The registry may point latest at the first version ever published,
              # whatever --tag says. Report it, because publish.yml moves latest to 0.6.2.
              if latest=$(node -e 'const t=JSON.parse(process.argv[1]);process.stdout.write(t.latest||"")' "$tags") && [ -n "$latest" ]; then
                echo "::warning::npm set latest to $latest on first publish. publish.yml moves latest to 0.6.2 on the verify-v0.6.2 release."
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::error::$PACKAGE@$VERSION did not resolve on the registry after publish"
          exit 1
