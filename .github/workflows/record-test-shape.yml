# Record K1.15 rules (a) and (b): the per-PR test-shape check.
#
# (a) A parser test per flag read, with an unknown value. (b) A fault test per Mnemom call
# site. Rule (c), a direct test per added branch, is graded by record-branch-test in
# mnemom-adw, not here. Only Record-lane PRs are graded (head `record/<lane>/<slug>` or the
# `record-lane` label). Any other PR passes with `in_scope: false`.
#
# The checker at .github/record-test-shape/check.cjs is mnemom/deploy
# gates/record-test-shape/check.js plus one adw:vendored-from line, printed by drift.js
# --emit-copy. flags.json is made by check.js --emit-flags (with --names-only in a public
# repo). Edit the files in mnemom/deploy first, then copy them here. The deploy-side drift
# check compares the copies.
#
# SECURITY: `pull_request`, a read-only token and no secrets. The checker and flags.json are
# read from the tip of the base branch, so a PR cannot change the checker or flags.json that
# grade it. This workflow file itself runs from the PR's merge commit, so a PR CAN edit it.
# What protects it is CODEOWNERS review on .github/workflows and a required check, not this
# job. The PR is read only as a diff. Its code is never checked out.
#
# Bootstrap: when the base branch tip has no checker, and the PR diff itself adds both
# check.cjs and flags.json, the copies at the PR head are run, in a step that holds no token.
# A base tip with this workflow but no checker, and a PR that does not add it, cannot be
# checked (exit 2). A base tip with neither, and a PR that does not add the checker, is not
# graded (pass, with a notice).
#
# The labels and the waiver are worked out by .github/scripts/record-test-shape-meta.sh
# (tested by record-test-shape-meta.test.sh in ci.yml), read from the base tip like the
# checker. When the base tip has no such script, the copy at the PR head is used, without the
# token; when neither has it the job cannot check (exit 2).
#
# The job fails closed: exit 1 is a failed rule, exit 2 is "could not check", and a failed
# API read or fetch stops the job. None of them reads green.
name: record-test-shape

on:
  pull_request:
    # labeled/unlabeled: `record-lane` changes the PR's scope and
    # `record-test-shape-waive` changes the verdict.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # Merge-queue trigger (MNE-1213, as in ci.yml): a required check must report in the
  # merge_group context or a queued PR waits on it forever. The job grades the PR diff and
  # labels, which a merge_group event does not carry, so it is skipped there; a skipped job
  # reports success. The PR was already graded on its own pull_request run.
  merge_group:

permissions:
  contents: read
  pull-requests: read
  # The label and label-event reads below use the issues/<n> endpoints.
  issues: read

concurrency:
  group: record-test-shape-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  record-test-shape:
    name: record-test-shape
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Checkout base branch tip (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never the PR head. The branch tip, not pull_request.base.sha: an open PR keeps the
          # base sha it was last synced on, which can predate the checker landing.
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Build the PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_tip="$(git rev-parse HEAD)"
          merge_base="$(gh api "repos/${GH_REPO}/compare/${base_tip}...${HEAD_SHA}" --jq .merge_base_commit.sha)"
          case "$merge_base" in
            ''|*[!0-9a-f]*) echo "no merge base for ${base_tip}...${HEAD_SHA}" >&2; exit 2;;
          esac
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags --depth=1 origin "$merge_base" "$HEAD_SHA"
          # Same content as `git diff --unified=0 <base>...<head>`: merge base against head.
          git diff --unified=0 --no-color --no-ext-diff "$merge_base" "$HEAD_SHA" > "$RUNNER_TEMP/pr.diff"
          # How many of the two checker files this PR adds (2 means it is the bootstrap PR).
          adds="$(git diff --name-only --diff-filter=A "$merge_base" "$HEAD_SHA" -- \
            .github/record-test-shape/check.cjs .github/record-test-shape/flags.json | wc -l | tr -d ' ')"
          echo "adds_checker=${adds}" >> "$GITHUB_OUTPUT"
          echo "base ${BASE_REF} at ${base_tip}, merge base ${merge_base}, head ${HEAD_SHA}, $(wc -c < "$RUNNER_TEMP/pr.diff") diff bytes"

      - name: Read labels and the waiver
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Read on every run: a later push is a `synchronize` event and does not name who
          # applied the waive label.
          gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/labels" --paginate > "$RUNNER_TEMP/labels.json"
          gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/events" --paginate > "$RUNNER_TEMP/events.json"
          meta=.github/scripts/record-test-shape-meta.sh
          if [ ! -f "$meta" ]; then
            # Bootstrap, as for the checker below: the base tip has no script and this PR adds it.
            if ! git cat-file -e "${HEAD_SHA}:${meta}" 2>/dev/null; then
              echo "::error::${BASE_REF} has this workflow but not ${meta}, so this PR cannot be checked"
              exit 2
            fi
            git show "${HEAD_SHA}:${meta}" > "$RUNNER_TEMP/record-test-shape-meta.sh"
            meta="$RUNNER_TEMP/record-test-shape-meta.sh"
            echo "::notice::no ${meta##*/} on ${BASE_REF}, using the copy at the PR head (bootstrap)"
          fi
          # The script reads only the two files above; the PR-head copy never sees the token.
          env -u GH_TOKEN bash "$meta" "$RUNNER_TEMP/labels.json" "$RUNNER_TEMP/events.json" "$GITHUB_OUTPUT"

      # No GH_TOKEN here: on the bootstrap path this step runs the PR's own copy of the checker.
      - name: Run the check
        env:
          ADDS_CHECKER: ${{ steps.diff.outputs.adds_checker }}
          LABELS: ${{ steps.meta.outputs.labels }}
          WAIVED_BY: ${{ steps.meta.outputs.waived_by }}
          WAIVED_BY_TYPE: ${{ steps.meta.outputs.waived_by_type }}
        run: |
          set -euo pipefail
          check=.github/record-test-shape/check.cjs
          flags=.github/record-test-shape/flags.json
          if [ -f "$check" ] && [ -f "$flags" ]; then
            echo "checker and flags.json from the tip of ${BASE_REF}"
          elif [ "$ADDS_CHECKER" = "2" ]; then
            # Bootstrap: the base tip has no checker and this PR's diff adds both files.
            mkdir -p "$RUNNER_TEMP/record-test-shape"
            git show "${HEAD_SHA}:${check}" > "$RUNNER_TEMP/record-test-shape/check.cjs"
            git show "${HEAD_SHA}:${flags}" > "$RUNNER_TEMP/record-test-shape/flags.json"
            check="$RUNNER_TEMP/record-test-shape/check.cjs"
            flags="$RUNNER_TEMP/record-test-shape/flags.json"
            echo "::notice::no checker on ${BASE_REF} and this PR adds it, using the copy at the PR head (bootstrap)"
          elif [ -f .github/workflows/record-test-shape.yml ]; then
            echo "::error::${BASE_REF} has this workflow but not ${check} and ${flags}, so this PR cannot be checked"
            exit 2
          else
            echo "::notice::${BASE_REF} has no record-test-shape checker and this PR does not add one, not graded"
            exit 0
          fi
          code=0
          # The `=` form keeps an empty value (no labels, no waiver) from reading as a
          # missing one, which the checker treats as "could not check".
          node "$check" \
            --diff="$RUNNER_TEMP/pr.diff" \
            --flags="$flags" \
            --head-ref="$HEAD_REF" \
            --labels="$LABELS" \
            --pr-author="$PR_AUTHOR" \
            --waived-by="$WAIVED_BY" \
            --waived-by-type="$WAIVED_BY_TYPE" \
            --out="$RUNNER_TEMP/record-test-shape-report.json" \
            --summary="$GITHUB_STEP_SUMMARY" || code=$?
          cat "$RUNNER_TEMP/record-test-shape-report.json"
          exit "$code"
