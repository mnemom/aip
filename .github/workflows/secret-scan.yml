# Secret scan: gitleaks over the working tree on every pull request and push to main.
#
# Same setup as mnemom/deploy's secret-scan.yml: a sha256-verified gitleaks CLI
# (no marketplace action) and a meta-check that proves the scan can still fail
# before trusting a clean result. The job is the `secret-scan` status check
# (record criterion K5.3).
#
# Every step reads .gitleaks.toml, which extends the default rules with reviewed
# allowlists for test fixtures and secret names. The fixture-path allowlists are
# per-rule and also require a fixture-shaped value. The meta-check uses the same
# file and plants keys under those paths, so an allowlist that switched the scan
# off would fail it. The gitleaks tarball is sha256-checked before it runs.

name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (sha256-verified)
        # The checksum is the linux_x64 line of the release's
        # gitleaks_${GITLEAKS_VERSION}_checksums.txt. A bump changes both values
        # together; a tarball that does not match fails here before it runs.
        env:
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$TARBALL" | sha256sum -c -
          tar -xz -C /usr/local/bin -f "$RUNNER_TEMP/$TARBALL" gitleaks
          gitleaks version

      - name: gitleaks can actually fail (meta-check)
        # Plants three made-up keys (AWS, Stripe live, generic api_key) in a
        # scratch dir, never the working tree. Each is planted alone at the root
        # and at each path the config allowlists (packages/verifier/test/helpers/sign.ts),
        # and every one must exit 1, so an allowlist that swallowed real keys
        # fails here. A clean line must
        # then exit 0. Any other exit code is an infra error and fails the step.
        run: |
          set -u
          SCRATCH="$(mktemp -d)"
          trap 'rm -rf "$SCRATCH"' EXIT
          # The Stripe value is joined at runtime so the literal never sits in
          # this file, where GitHub push protection would block it.
          STRIPE_PREFIX="sk_""live_"
          PLANTS=(
            'aws_key = "AKIAABCDEFGHIJKLMNOP"' # gitleaks:allow
            "stripe_key = \"${STRIPE_PREFIX}PLACEHOLDERnotArealKEY0000fake\""
            'api_key = "Zq8xW3vN7mK2pR5tY9bL4cJ6hD1sF0gX"' # gitleaks:allow (random, not a key)
          )
          PATHS=(fixture.txt packages/verifier/test/helpers/sign.ts)
          failed=0
          for plant in "${PLANTS[@]}"; do
            for rel in "${PATHS[@]}"; do
              find "$SCRATCH" -mindepth 1 -delete
              mkdir -p "$SCRATCH/$(dirname "$rel")"
              printf '%s\n' "$plant" > "$SCRATCH/$rel"
              set +e
              gitleaks dir "$SCRATCH" --config .gitleaks.toml --no-banner --exit-code 1 >"$RUNNER_TEMP/gitleaks-meta.log" 2>&1
              CODE=$?
              set -e
              if [ "$CODE" -ne 1 ]; then
                echo "::error::gitleaks did not detect the ${plant%% =*} plant at $rel (exit $CODE, expected 1). Log:"
                cat "$RUNNER_TEMP/gitleaks-meta.log"
                failed=1
              fi
            done
          done
          [ "$failed" -eq 0 ] || exit 1
          find "$SCRATCH" -mindepth 1 -delete
          echo 'const greeting = "hello world";' > "$SCRATCH/fixture.txt"
          set +e
          gitleaks dir "$SCRATCH" --config .gitleaks.toml --no-banner --exit-code 1 >"$RUNNER_TEMP/gitleaks-meta-clean.log" 2>&1
          CLEAN_CODE=$?
          set -e
          if [ "$CLEAN_CODE" -ne 0 ]; then
            echo "::error::gitleaks flagged clean content (exit $CLEAN_CODE, expected 0). Log:"
            cat "$RUNNER_TEMP/gitleaks-meta-clean.log"
            exit 1
          fi

      - name: gitleaks (working tree)
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1

      - name: gitleaks (history)
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact --exit-code 1
