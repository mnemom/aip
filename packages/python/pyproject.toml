[build-system]
# Exact-pinned (MNE-7279 / aip#141): `requires` was previously unbounded, so every
# `python -m build` / `uv build` resolves the build backend fresh in an isolated
# env (PEP 517) — this is NOT influenced by .github/requirements/build.txt, which
# only pins the outer build *frontend* (build/pip/packaging/pyproject-hooks), not
# packages listed here. hatchling 1.30.0+ started emitting `Metadata-Version: 2.5`
# (hatchling 1.32.0 made 2.5 the default); 1.32.4 is the version verified locally
# to build this package with `Metadata-Version: 2.5` and pass `twine check --strict`
# against the exact `twine`/`packaging` versions pinned by
# pypa/gh-action-pypi-publish@v1.14.2 in publish.yml. Bumping this pin later is
# fine, but re-verify (build + `twine check --strict`) first — an unbounded
# `requires` is what let a hatchling release silently regress this in the first
# place.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "agent-integrity-proto"
version = "1.3.0"
description = "Agent Integrity Protocol — real-time thinking block analysis for AI agent alignment"
readme = "README.md"
license = "Apache-2.0"
# Deliberate floor: 3.10 = published-SDK minimum (don't break downstream
# consumers); dev/CI baseline is pinned to 3.12 via .python-version. ruff
# target-version / mypy python_version stay at py310 to lint against the floor.
requires-python = ">=3.10"
authors = [{ name = "Mnemom.ai", email = "dev@mnemom.ai" }]
keywords = [
    "ai",
    "agent",
    "integrity",
    "alignment",
    "thinking",
    "conscience",
    "safety",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/mnemom/aip"
Documentation = "https://github.com/mnemom/aip/blob/main/docs/SPEC.md"
Repository = "https://github.com/mnemom/aip"
Issues = "https://github.com/mnemom/aip/issues"
Changelog = "https://github.com/mnemom/aip/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.22",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aip"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov --cov-report=xml --cov-report=term"

[tool.coverage.run]
source = ["src/aip"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]
ignore = ["E501", "A002", "B011", "B904", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B007"]
